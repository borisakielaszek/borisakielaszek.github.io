name: Add online game link to main site
on:
  push:
    paths:
      - '.github/workflows/add-online-game-link.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add online game link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'href="/jeu-vampires-de-sarrebruck/"' in s and 'Jouer en ligne' in s:
              print('Online game link already present')
              raise SystemExit(0)
          old='Un jeu original conçu par Boris Akielaszek à partir de l’univers du livre, mêlant personnages, humour et mécanique de jeu.</p>'
          new=('Un jeu original conçu par Boris Akielaszek à partir de l’univers du livre, mêlant personnages, humour et mécanique de jeu.</p>'
               '<p>Le jeu est également disponible gratuitement en version numérique, jouable directement dans votre navigateur.</p>'
               '<div class="links"><a href="/jeu-vampires-de-sarrebruck/">Jouer en ligne</a></div>')
          if old not in s:
              raise SystemExit('Target game paragraph not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add online game link to card game section"
          git push
