name: Audit Vampire Game

on:
  push:
    paths:
      - '.github/workflows/audit-vampire-game.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static audit
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, base64, subprocess, tempfile, os

          root=Path('jeu-vampires-de-sarrebruck')
          p=root/'index.html'
          s=p.read_text(encoding='utf-8')
          assets=root/'assets'
          print('=== VAMPIRE GAME AUDIT ===')
          print('index bytes:', p.stat().st_size)

          refs=sorted(set(x.split('?')[0].split('#')[0] for x in re.findall(r"assets/([A-Za-z0-9_.-]+(?:[?#][^\\s\\\"'<>)]*)?)",s)))
          missing=[]; empty=[]
          for r in refs:
              f=assets/r
              if not f.exists(): missing.append(r)
              elif f.stat().st_size==0: empty.append(r)
          print('referenced asset files:',len(refs))
          print('MISSING_REFERENCED_ASSETS:', missing or 'NONE')
          print('EMPTY_REFERENCED_ASSETS:', empty or 'NONE')

          zero=[f.name for f in assets.iterdir() if f.is_file() and f.stat().st_size==0]
          print('ZERO_BYTE_ASSETS_TOTAL:', zero or 'NONE')

          class P(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]
              def handle_starttag(self,tag,attrs):
                  for k,v in attrs:
                      if k=='id' and v:self.ids.append(v)
          hp=P(); hp.feed(s)
          from collections import Counter
          dup=sorted(k for k,v in Counter(hp.ids).items() if v>1)
          print('DUPLICATE_HTML_IDS:', dup or 'NONE')

          scripts=re.findall(r'<script\\b([^>]*)>(.*?)</script>',s,re.I|re.S)
          js_errors=[]; checked=0
          for i,(attrs,body) in enumerate(scripts):
              if 'src=' in attrs.lower() or not body.strip(): continue
              if 'application/ld+json' in attrs.lower(): continue
              checked+=1
              fn=f'/tmp/audit_{i}.js'
              Path(fn).write_text(body,encoding='utf-8')
              cp=subprocess.run(['node','--check',fn],text=True,capture_output=True)
              if cp.returncode: js_errors.append((i,(cp.stderr or cp.stdout).strip()[-1000:]))
          print('INLINE_JS_BLOCKS_CHECKED:',checked)
          print('JS_SYNTAX_ERRORS:',js_errors or 'NONE')

          # Audio elements and source sanity
          audios=[]
          for m in re.finditer(r'<audio\\b([^>]*)>',s,re.I|re.S):
              a=m.group(1)
              mid=re.search(r'\\bid=["\\\']([^"\\\']+)',a,re.I)
              src=re.search(r'\\bsrc=["\\\']([^"\\\']+)',a,re.I)
              if mid and src: audios.append((mid.group(1),src.group(1)))
          print('AUDIO_ELEMENTS:')
          for aid,src in audios:
              if src.startswith('data:audio/'):
                  try:
                      raw=base64.b64decode(src.split(',',1)[1],validate=False)
                      print(f'  {aid}: inline audio {len(raw)} bytes')
                  except Exception as e: print(f'  {aid}: INVALID_DATA_URI {e}')
              else:
                  rel=src.split('?')[0]
                  f=root/rel
                  print(f'  {aid}: {rel} -> '+(('OK '+str(f.stat().st_size)+' bytes') if f.exists() else 'MISSING'))

          # Critical routing/invariants
          checks={
            'combat_sfx_intentionally_disabled': bool(re.search(r'function\\s+playCombatSfx\\([^)]*\\)\\s*\\{\\s*return\\s*;',s)),
            'victory_profile_routing': "playEndgameMusic(hunterVictory?'helsingVictoryMusic':'victoryMusic')" in s,
            'defeat_profile_routing': "playEndgameMusic(isVanHelsing(p)?'helsingDefeatMusic':'defeatMusic')" in s,
            'dracula_victory_art': "assets/dracula-victoire.webp" in s,
            'dracula_defeat_art': "assets/dracula-defaite.webp" in s,
            'helsing_victory_art': "assets/van-helsing-victoire-biere.webp" in s,
            'helsing_defeat_art': "assets/van-helsing-defaite.webp" in s,
            'validated_bullet_image_used': "assets/van-helsing-balles-consacrees-valide.webp" in s,
            'obsolete_empty_bullet_not_used': "assets/van-helsing-balles-consacrees.webp" not in s,
            'obsolete_tiny_thunder_v2_not_used': "assets/thunder-intro-v2.mp3" not in s,
          }
          print('CRITICAL_CHECKS:')
          for k,v in checks.items(): print(' ',k,':', 'PASS' if v else 'FAIL')

          modes=sorted(set(re.findall(r"secretMode\\s*===?\\s*['\"]([^'\"]+)",s)))
          assigned=sorted(set(re.findall(r"secretMode\\s*[:=]\\s*['\"]([^'\"]+)",s)))
          print('SECRET_MODES_COMPARED:',modes)
          print('SECRET_MODES_ASSIGNED:',assigned)

          # Static DOM IDs referenced via el('...') but absent in markup; often dynamic, report as warning only.
          static_ids=set(hp.ids)
          elrefs=set(re.findall(r"\\bel\\(['\"]([^'\"]+)['\"]\\)",s))
          missing_ids=sorted(elrefs-static_ids)
          print('EL_REFS_WITHOUT_STATIC_ID_WARNING:',missing_ids)

          # Selected gameplay rule markers expected from current design
          markers={
            'dracula_gold_blood_rule': ('goldBlood' in s and 'Dracula' in s),
            'saint_nicolas_present': ('Saint Nicolas' in s or 'saint_nicolas' in s.lower()),
            'weihnachtsmarkt_present': ('Weihnacht' in s or 'Marché de Noël' in s),
            'bat_escape_present': ('chauve-souris' in s.lower()),
            'helsing_ammo_present': all(x in s for x in ['blessedBullets','silverBolts','gepettoStakes']),
          }
          print('GAMEPLAY_MARKERS:')
          for k,v in markers.items(): print(' ',k,':','PASS' if v else 'FAIL')
          print('=== END AUDIT ===')
          PY
