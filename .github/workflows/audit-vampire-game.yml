name: Audit Vampire Game

on:
  push:
    paths:
      - '.github/workflows/audit-vampire-game.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deck and mode audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re

          p=Path('jeu-vampires-de-sarrebruck/index.html')
          s=p.read_text(encoding='utf-8')

          def section(start_marker,end_marker):
              a=s.index(start_marker)+len(start_marker)
              b=s.index(end_marker,a)
              return s[a:b]

          cards=section('const CARDS={','\n};\n\nconst VAMPIRES=')
          entries=re.findall(r'^\s*([A-Za-z0-9_]+):\{([^\n]*)\},?\s*$',cards,re.M)
          ids=[k for k,_ in entries]
          qty={}
          kinds={}
          imgs={}
          for k,body in entries:
              m=re.search(r'qty:(\d+)',body); qty[k]=int(m.group(1)) if m else None
              m=re.search(r"kind:['\"]([^'\"]+)",body); kinds[k]=m.group(1) if m else None
              m=re.search(r"img:['\"]([^'\"]+)",body); imgs[k]=m.group(1) if m else None
          print('CARD_DEFINITIONS:',len(ids))
          print('DUPLICATE_CARD_IDS:',sorted(k for k,v in Counter(ids).items() if v>1) or 'NONE')
          print('CARDS_WITHOUT_QTY:',sorted(k for k,v in qty.items() if v is None) or 'NONE')
          print('ACTION_DECK_TOTAL_QTY:',sum(v for v in qty.values() if v is not None))
          print('POSITIVE_QTY_CARD_TYPES:',sum(1 for v in qty.values() if v and v>0))
          print('ZERO_QTY_SECRET_TYPES:',sorted(k for k,v in qty.items() if v==0))
          print('CARD_KINDS:',dict(Counter(v for v in kinds.values() if v)))
          bad_card_imgs=[(k,v) for k,v in imgs.items() if v and not (Path('jeu-vampires-de-sarrebruck')/v).exists()]
          print('MISSING_CARD_IMAGES:',bad_card_imgs or 'NONE')

          vamp=section('const VAMPIRES={','\n};\n\nconst VAMP_POWERS=')
          ventries=re.findall(r'^\s*([A-Za-z0-9_]+):\{([^\n]*)\},?\s*$',vamp,re.M)
          vids=[k for k,_ in ventries]
          print('VAMPIRE_DEFINITIONS:',len(vids),vids)
          print('DUPLICATE_VAMPIRE_IDS:',sorted(k for k,v in Counter(vids).items() if v>1) or 'NONE')
          missing_vamp_imgs=[]
          for k,body in ventries:
              m=re.search(r"img:['\"]([^'\"]+)",body)
              if m and not (Path('jeu-vampires-de-sarrebruck')/m.group(1)).exists(): missing_vamp_imgs.append((k,m.group(1)))
          print('MISSING_VAMPIRE_IMAGES:',missing_vamp_imgs or 'NONE')

          # Card IDs explicitly compared in gameplay should normally exist in CARDS.
          compared=set()
          for pat in [r"(?:card|c)\.id\s*===?\s*['\"]([A-Za-z0-9_]+)['\"]",r"cardId\s*===?\s*['\"]([A-Za-z0-9_]+)['\"]"]:
              compared.update(re.findall(pat,s))
          print('EXPLICIT_CARD_IDS_NOT_DEFINED:',sorted(compared-set(ids)) or 'NONE')

          # Setup/deal capacity for every normal player count.
          positive=[k for k,v in qty.items() if v and v>0]
          total=sum(qty[k] for k in positive)
          immediate=sum(qty[k] for k in positive if kinds.get(k)=='immediate')
          non_immediate=total-immediate
          print('NON_IMMEDIATE_QTY:',non_immediate,'IMMEDIATE_QTY:',immediate)
          for players in range(2,6):
              need=players*6
              print(f'INITIAL_DEAL_{players}_PLAYERS:', 'PASS' if non_immediate>=need else 'FAIL', 'need',need)
          # Van Helsing is not dealt vampire cards; max vampire recipients = 4.
          print('INITIAL_DEAL_VAN_HELSING_PLUS_4_AI:', 'PASS' if non_immediate>=24 else 'FAIL')

          checks={
            'difficulty_options_all_present': all(f'value="{x}"' in s for x in ['easy','normal','hard']),
            'normal_mode_uses_selected_difficulty': "S?.difficulty||'normal'" in s,
            'dracula_forces_easy_ai': "S?.secretMode==='dracula'?'easy'" in s,
            'dracula_log_mentions_indulgent_ai': 'adversaires indulgents' in s,
            'helsing_balance_has_all_difficulties': all(('"'+x+'":') in s for x in ['easy','normal','hard']),
            'player_counts_2_to_5': all(f'value="{n}"' in s for n in range(2,6)),
            'blood_pool_26': 'pool:26-players.reduce' in s,
            'six_card_initial_hand': 'for(let r=0;r<6;r++)' in s,
            'witches_hand_limit_7': 'p.witches?7:' in s or '?7' in s,
          }
          print('MODE_AND_SETUP_CHECKS:')
          for k,v in checks.items(): print(k,'PASS' if v else 'FAIL')
          PY
