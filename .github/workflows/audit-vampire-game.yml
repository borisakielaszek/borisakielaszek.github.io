name: Audit Vampire Game

on:
  push:
    paths:
      - '.github/workflows/audit-vampire-game.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static audit
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from collections import Counter
          import re, base64, subprocess

          root=Path('jeu-vampires-de-sarrebruck')
          p=root/'index.html'
          s=p.read_text(encoding='utf-8')
          css='\n'.join(x.read_text(encoding='utf-8',errors='ignore') for x in root.glob('*.css'))
          assets=root/'assets'
          print('=== VAMPIRE GAME AUDIT V2 ===')
          print('INDEX_BYTES:',p.stat().st_size)

          # Only complete literal media paths; dynamic template prefixes are deliberately ignored.
          refs=sorted(set(re.findall(r'assets/[A-Za-z0-9_.-]+[.](?:webp|png|jpg|jpeg|mp3|ogg|wav|svg)',s+'\n'+css,re.I)))
          missing=[]; empty=[]; badmime=[]
          for r in refs:
              f=root/r
              if not f.exists(): missing.append(r); continue
              if f.stat().st_size==0: empty.append(r); continue
              ext=f.suffix.lower()
              if ext in {'.webp','.png','.jpg','.jpeg','.mp3','.ogg','.wav'}:
                  cp=subprocess.run(['file','--mime-type','-b',str(f)],text=True,capture_output=True)
                  mime=cp.stdout.strip()
                  if ext in {'.webp','.png','.jpg','.jpeg'} and not mime.startswith('image/'): badmime.append((r,mime))
                  if ext in {'.mp3','.ogg','.wav'} and not (mime.startswith('audio/') or mime=='application/octet-stream'): badmime.append((r,mime))
          print('LITERAL_MEDIA_REFS:',len(refs))
          print('MISSING_LITERAL_MEDIA:',missing or 'NONE')
          print('EMPTY_LITERAL_MEDIA:',empty or 'NONE')
          print('BAD_MEDIA_MIME:',badmime or 'NONE')
          zero=sorted(f.name for f in assets.iterdir() if f.is_file() and f.stat().st_size==0)
          print('ZERO_BYTE_ASSETS_TOTAL:',zero or 'NONE')

          class H(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]
              def handle_starttag(self,tag,attrs):
                  self.ids += [v for k,v in attrs if k=='id' and v]
          h=H(); h.feed(s)
          dup=sorted(k for k,v in Counter(h.ids).items() if v>1)
          print('DUPLICATE_HTML_IDS:',dup or 'NONE')

          scripts=re.findall(r'<script([^>]*)>(.*?)</script>',s,re.I|re.S)
          checked=0; js_errors=[]
          for i,(attrs,body) in enumerate(scripts):
              if 'src=' in attrs.lower() or not body.strip() or 'application/ld+json' in attrs.lower(): continue
              checked+=1
              fn=Path('/tmp')/f'audit_{i}.js'; fn.write_text(body,encoding='utf-8')
              cp=subprocess.run(['node','--check',str(fn)],text=True,capture_output=True)
              if cp.returncode: js_errors.append((i,(cp.stderr or cp.stdout).strip()[-1200:]))
          print('INLINE_JS_BLOCKS_CHECKED:',checked)
          print('JS_SYNTAX_ERRORS:',js_errors or 'NONE')

          audios=[]
          for m in re.finditer(r'<audio([^>]*)>',s,re.I|re.S):
              a=m.group(1)
              mid=re.search(r'id=["\u0027]([^"\u0027]+)',a,re.I)
              src=re.search(r'src=["\u0027]([^"\u0027]+)',a,re.I)
              if mid and src: audios.append((mid.group(1),src.group(1)))
          print('AUDIO_ELEMENTS_COUNT:',len(audios))
          for aid,src in audios:
              if src.startswith('data:audio/'):
                  try:
                      raw=base64.b64decode(src.split(',',1)[1],validate=False)
                      print('AUDIO',aid,'INLINE_BYTES',len(raw),'OK' if len(raw)>1000 else 'SUSPICIOUS')
                  except Exception as e: print('AUDIO',aid,'INVALID_DATA_URI',e)
              else:
                  rel=src.split('?')[0]; f=root/rel
                  print('AUDIO',aid,rel,('OK '+str(f.stat().st_size)+' bytes') if f.exists() and f.stat().st_size>0 else 'MISSING_OR_EMPTY')

          checks={
            'combat_sfx_intentionally_disabled': 'function playCombatSfx(success=true){\n return;' in s,
            'victory_profile_routing': "playEndgameMusic(hunterVictory?'helsingVictoryMusic':'victoryMusic')" in s,
            'defeat_profile_routing': "playEndgameMusic(isVanHelsing(p)?'helsingDefeatMusic':'defeatMusic')" in s,
            'dracula_mode_exists': "return key==='dracula'?'dracula'" in s,
            'van_helsing_mode_exists': "'van_helsing'" in s and 'Van Helsing' in s,
            'dracula_victory_art': 'assets/dracula-victoire.webp' in s,
            'dracula_defeat_art': 'assets/dracula-defaite.webp' in s,
            'helsing_victory_art': 'assets/van-helsing-victoire-biere.webp' in s,
            'helsing_defeat_art': 'assets/van-helsing-defaite.webp' in s,
            'validated_bullet_image_used': 'assets/van-helsing-balles-consacrees-valide.webp' in s,
            'obsolete_empty_bullet_not_used': 'assets/van-helsing-balles-consacrees.webp' not in s,
            'obsolete_tiny_thunder_v2_not_used': 'assets/thunder-intro-v2.mp3' not in s,
            'saint_nicolas_helsing_gold': "id==='saint_nicolas'&&isVanHelsing(target)" in s and 'grantSaintNicolasGold(target)' in s,
            'christmas_draws_two_common_deck': "drawCards(x,2,'marche_noel')" in s and 'Aucune carte n’est prise au voisin' in s,
            'helsing_christmas_two_objects': "recoverHelsingAmmo(x);recoverHelsingAmmo(x)" in s,
            'helsing_search_feedback': 'tu ne trouves aucune fourniture à emporter cette fois' in s,
            'bat_escape_present': 'Fuite en chauve-souris' in s,
            'helsing_ammo_state': all(x in s for x in ['blessedBullets','silverBolts','gepettoStakes']),
          }
          print('CRITICAL_CHECKS:')
          for k,v in checks.items(): print(k, 'PASS' if v else 'FAIL')
          print('=== END AUDIT V2 ===')
          PY
