name: Restore Vampires profile banner

on:
  push:
    paths:
      - '.github/workflows/restore-vampires-banner.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore working WebP banner
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '/assets/vampires-sarrebruck-banner.svg?v=20261024-sharp'
          new = '/assets/vampires-sarrebruck-banner-final.webp?v=20261024-restored'
          if old not in s:
              raise SystemExit('SVG banner reference not found; no change made')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/restore-vampires-banner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/restore-vampires-banner.yml
          git commit -m 'Restore working WebP Vampires banner'
          git push