name: Temporary fix - vampire tutorial crossed swords icon

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace arrow-like tutorial icon with crossed swords
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('jeu-vampires-de-sarrebruck/index.html')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if "if(type==='swords')g=" in line]

          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one swords icon definition, found {len(matches)}; refusing to modify the file.")

          replacement = (
              " if(type==='swords')g='<g stroke=\"#111\" stroke-linecap=\"round\" stroke-linejoin=\"round\">"
              "<g transform=\"rotate(-45 50 50)\"><path d=\"M47 17h6l2 37-5 10-5-10z\" fill=\"#111\" stroke=\"none\"/>"
              "<path d=\"M38 59h24\" stroke-width=\"5\"/><path d=\"M50 61v18\" stroke-width=\"5\"/>"
              "<circle cx=\"50\" cy=\"83\" r=\"4\" fill=\"#111\" stroke=\"none\"/></g>"
              "<g transform=\"rotate(45 50 50)\"><path d=\"M47 17h6l2 37-5 10-5-10z\" fill=\"#111\" stroke=\"none\"/>"
              "<path d=\"M38 59h24\" stroke-width=\"5\"/><path d=\"M50 61v18\" stroke-width=\"5\"/>"
              "<circle cx=\"50\" cy=\"83\" r=\"4\" fill=\"#111\" stroke=\"none\"/></g></g>';\n"
          )
          lines[matches[0]] = replacement
          path.write_text(''.join(lines), encoding='utf-8')
          print('Replaced the tutorial attack symbol with two clearly crossed swords.')
          PY

      - name: Commit targeted icon fix
        shell: bash
        run: |
          if git diff --quiet -- jeu-vampires-de-sarrebruck/index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jeu-vampires-de-sarrebruck/index.html
          git commit -m 'Fix crossed swords icon in vampire tutorial'
          git push origin HEAD:main
