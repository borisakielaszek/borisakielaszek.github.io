name: Update DriveThruCards purchase link

on:
  push:
    paths:
      - '.github/workflows/update-drivethrucards-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update purchase links on personal site
        run: python3 .github/scripts/update-drivethrucards-link.py
      - name: Commit updated personal site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add DriveThruCards purchase link to personal site"
            git push
          fi
