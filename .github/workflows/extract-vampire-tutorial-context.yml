name: Test vampire first-night tutorial

on:
  push:
    paths:
      - '.github/workflows/extract-vampire-tutorial-context.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch tutorial into French game
        run: python3 .github/scripts/patch-vampire-first-night-tutorial.py
      - name: Commit patched game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jeu-vampires-de-sarrebruck/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add first-night interactive vampire tutorial"
            git push
          fi
