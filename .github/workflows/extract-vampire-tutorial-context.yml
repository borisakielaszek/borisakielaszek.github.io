name: Extract vampire tutorial context

on:
  push:
    paths:
      - '.github/workflows/extract-vampire-tutorial-context.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract tutorial context
        run: python3 .github/scripts/extract-vampire-tutorial-context.py
      - name: Commit extracted context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-vampire-tutorial-context.txt
          if ! git diff --cached --quiet; then
            git commit -m "Extract vampire tutorial context"
            git push
          fi
