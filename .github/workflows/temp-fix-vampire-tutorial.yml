name: Temporary fix - French vampire tutorial trigger

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy automatic guide trigger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('jeu-vampires-de-sarrebruck/index.html')
          text = path.read_text(encoding='utf-8')
          needle = 'setTimeout(offerFirstNightGuide, 120);'
          count = text.count(needle)
          if count == 0:
              print('Legacy automatic guide trigger is already absent.')
              raise SystemExit(0)
          if count != 1:
              raise SystemExit(f'Expected exactly one legacy trigger, found {count}; refusing to modify the file.')

          lines = text.splitlines(keepends=True)
          new_lines = [line for line in lines if needle not in line]
          path.write_text(''.join(new_lines), encoding='utf-8')
          print('Removed exactly one legacy automatic guide trigger.')
          PY

      - name: Commit targeted fix
        shell: bash
        run: |
          if git diff --quiet -- jeu-vampires-de-sarrebruck/index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jeu-vampires-de-sarrebruck/index.html
          git commit -m 'Fix French vampire tutorial first-entry trigger'
          git push origin HEAD:main
