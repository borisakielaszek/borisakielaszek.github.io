name: Compact vampire game help menu

on:
  push:
    paths:
      - '.github/workflows/compact-vampire-help-menu.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch game interface
        run: python3 .github/scripts/patch-vampire-help-menu.py
      - name: Commit game interface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jeu-vampires-de-sarrebruck/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add tap-to-continue turn transitions"
            git push
          fi
# v5.64 turn transition fix
