name: Vampire intro user assets

on:
  push:
    paths:
      - '.github/workflows/vampire-intro-user-assets.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact user thunder
        shell: bash
        run: |
          cat \
            .github/tmp/thunder00.b64 \
            .github/tmp/thunder01.b64 \
            .github/tmp/thunder02.b64 \
            .github/tmp/thunder03.b64 \
            .github/tmp/thunder04.b64 \
            .github/tmp/thunder05.b64 \
            .github/tmp/thunder06.b64 \
            .github/tmp/thunder07.b64 \
            .github/tmp/thunder08.b64 \
            .github/tmp/thunder09.b64 \
            .github/tmp/thunder10.b64 \
            .github/tmp/thunder11.b64 \
            .github/tmp/thunder12.b64 \
            | tr -d '\r\n' > /tmp/thunder.b64
          base64 -d /tmp/thunder.b64 > jeu-vampires-de-sarrebruck/assets/thunder-intro-user.mp3
          test "$(stat -c%s jeu-vampires-de-sarrebruck/assets/thunder-intro-user.mp3)" -gt 20000
          python3 - <<'PY'
          p='jeu-vampires-de-sarrebruck/assets/thunder-intro-user.mp3'
          data=open(p,'rb').read(16)
          size=__import__('os').path.getsize(p)
          print('Audio bytes:', data)
          print('Audio size:', size)
          assert data[:3] == b'ID3' or data[:2] in (b'\xff\xfb', b'\xff\xf3', b'\xff\xf2')
          PY
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 jeu-vampires-de-sarrebruck/assets/thunder-intro-user.mp3

      - name: Replace intro with user thunder and lightning
        run: python3 .github/scripts/patch-intro-user-assets.py

      - name: Commit corrected intro
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jeu-vampires-de-sarrebruck/index.html jeu-vampires-de-sarrebruck/assets/thunder-intro-user.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Use exact uploaded thunder and user lightning artwork"
            git push
          fi
