name: Vampire intro user assets

on:
  push:
    paths:
      - '.github/workflows/vampire-intro-user-assets.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect final thunder chunks
        shell: bash
        run: |
          echo '--- sizes ---'
          wc -c .github/tmp/exact09a.b64 .github/tmp/exact12b.b64
          echo '--- hashes ---'
          sha256sum .github/tmp/exact09a.b64 .github/tmp/exact12b.b64
          echo '--- expected ---'
          echo '09a size 3000 hash ac12d8b42e69d328c35d5301ca9bef30da9292e48b0297ad80dd15b533615eb0'
          echo '12b size 2900 hash 4dfcd9f5337f71098007e7627e6a477007112925a320cfb8c2f9bd387262f2dd'
