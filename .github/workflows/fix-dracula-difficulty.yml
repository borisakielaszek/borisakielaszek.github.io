name: Fix Dracula Difficulty

on:
  push:
    paths:
      - '.github/workflows/fix-dracula-difficulty.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Respect selected difficulty while keeping Dracula advantages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('jeu-vampires-de-sarrebruck/index.html')
          s=p.read_text(encoding='utf-8')
          old="function aiDifficulty(){return S?.secretMode==='dracula'?'easy':S?.difficulty||'normal'}"
          new="function aiDifficulty(){return S?.difficulty||'normal'}"
          if old not in s:
              raise SystemExit('Expected Dracula difficulty override not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jeu-vampires-de-sarrebruck/index.html
          git commit -m "Keep Dracula advantage across selected difficulty levels"
          git push
