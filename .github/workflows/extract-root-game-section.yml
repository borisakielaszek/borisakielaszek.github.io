name: Extract root game section
on:
  push:
    paths:
      - '.github/workflows/extract-root-game-section.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract snippet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          keys=['Les Vampires de Sarrebruck — le jeu de cartes','Les Vampires de Sarrebruck - le jeu de cartes','id="jeux"','<section id="jeux"']
          pos=-1
          for k in keys:
              pos=s.find(k)
              if pos!=-1: break
          if pos==-1:
              raise SystemExit('game section not found')
          start=max(0,pos-1800); end=min(len(s),pos+3500)
          Path('.github/root-game-section.txt').write_text(s[start:end],encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/root-game-section.txt
          git commit -m "Extract root game section for update"
          git push
