name: Add vampire about rights v2

on:
  push:
    paths:
      - '.github/workflows/add-vampire-about-rights-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production game
        run: python3 .github/scripts/add-vampire-about-rights.py
      - name: Commit production update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jeu-vampires-de-sarrebruck/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add About and rights to vampire game"
            git push
          fi
