name: Fix Vampires banner on mobile

on:
  push:
    paths:
      - '.github/workflows/fix-vampire-banner-mobile.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Convert embedded banner to direct WebP
        run: python3 .github/scripts/fix-vampire-banner-mobile.py
      - name: Commit mobile-safe banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vampires-sarrebruck-banner-final.webp index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix Vampires banner display on mobile"
            git push
          fi
