name: Friendly global event notices

on:
  push:
    paths:
      - '.github/workflows/friendly-global-events.yml'
      - '.github/scripts/friendly_global_events.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch game messages
        run: python3 .github/scripts/friendly_global_events.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jeu-vampires-de-sarrebruck/index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Clarify Hexennacht and Christmas Market for beginners"
          git push
