name: Extract Balai Snippets

on:
  push:
    paths:
      - '.github/workflows/tmp-extract-balai.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract snippets around balai and Oeting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('jeu-vampires-de-sarrebruck/index.html')
          s=p.read_text(encoding='utf-8')
          terms=['Balai','balai','Oeting','Hexennacht']
          out=[]
          seen=set()
          for term in terms:
              start=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  a=max(0,i-900); b=min(len(s),i+1400)
                  key=(a,b)
                  if key not in seen:
                      seen.add(key)
                      out.append(f'--- {term} @ {i} ---\n'+s[a:b])
                  start=i+len(term)
          Path('tmp-balai-snippets.txt').write_text('\n\n'.join(out),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-balai-snippets.txt
          git commit -m "Extract balai snippets for correction" || exit 0
          git push
