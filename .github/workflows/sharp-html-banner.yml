name: Sharp HTML Vampires banner

on:
  push:
    paths:
      - '.github/workflows/sharp-html-banner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace raster text with HTML overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_start = '<div class="online-game-banner-wrap"><a href="/jeu-vampires-de-sarrebruck/" aria-label="Jouer en ligne aux Vampires de Sarrebruck"><img src="/assets/vampires-sarrebruck-banner-final.webp?v=20261024-restored" alt="Jouez aux Vampires de Sarrebruck — version numérique gratuite" loading="lazy" decoding="async"></a></div>'
          if old_start not in s:
              old_start = '<div class="online-game-banner-wrap"><a href="/jeu-vampires-de-sarrebruck/" aria-label="Jouer en ligne aux Vampires de Sarrebruck"><img src="/assets/vampires-sarrebruck-banner-final.webp?v=20261023-mobilefix2" alt="Jouez aux Vampires de Sarrebruck — version numérique gratuite" loading="lazy" decoding="async"></a></div>'
          new = '''<div class="online-game-banner-wrap sharp-html-banner">
<a class="sharp-html-banner-link" href="/jeu-vampires-de-sarrebruck/" aria-label="Jouer en ligne aux Vampires de Sarrebruck">
<img class="sharp-html-banner-bg" src="/assets/vampires-sarrebruck-banner-final.webp?v=20261024-restored" alt="" loading="lazy" decoding="async">
<span class="sharp-html-banner-mask" aria-hidden="true"></span>
<span class="sharp-html-banner-copy">
<span class="sharp-html-banner-title">Jouez aux<br><strong><em>Vampires</em> de Sarrebruck</strong></span>
<span class="sharp-html-banner-text">Retrouvez les vampires du livre dans une version numérique gratuite,<br>jouable directement dans votre navigateur.</span>
<span class="sharp-html-banner-text">Choisissez votre vampire, affrontez plusieurs adversaires contrôlés par l’IA<br>et tentez de survivre jusqu’à l’aube.</span>
<span class="sharp-html-banner-note">Aucune installation nécessaire.</span>
<span class="sharp-html-banner-button">ENTRER DANS LA NUIT</span>
</span>
</a>
</div>'''
          if old_start not in s:
              raise SystemExit('Banner markup not found')
          s = s.replace(old_start, new)
          marker = '</style>'
          css = '''
.sharp-html-banner{position:relative!important;overflow:hidden!important;isolation:isolate!important;background:#080808!important}
.sharp-html-banner-link{position:relative!important;display:block!important;width:100%!important;color:#fff!important;text-decoration:none!important}
.sharp-html-banner-bg{display:block!important;width:100%!important;height:auto!important}
.sharp-html-banner-mask{position:absolute!important;inset:0!important;z-index:1!important;background:radial-gradient(ellipse at 50% 48%,rgba(3,3,5,.98) 0%,rgba(3,3,5,.94) 23%,rgba(3,3,5,.82) 36%,rgba(3,3,5,.35) 48%,rgba(3,3,5,0) 62%)!important;pointer-events:none!important}
.sharp-html-banner-copy{position:absolute!important;z-index:2!important;inset:6% 18% 7%!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important;font-family:Georgia,'Times New Roman',serif!important;text-shadow:0 3px 8px #000,0 0 14px #000!important;line-height:1.22!important}
.sharp-html-banner-title{display:block!important;font-size:clamp(30px,4.4vw,78px)!important;line-height:.98!important;margin-bottom:1.4vw!important;font-weight:500!important}
.sharp-html-banner-title strong{font-weight:700!important}.sharp-html-banner-title em{color:#c81717!important;font-style:normal!important}
.sharp-html-banner-text{display:block!important;font-size:clamp(12px,1.35vw,24px)!important;line-height:1.32!important;margin:.28vw 0!important}
.sharp-html-banner-note{display:block!important;font-size:clamp(11px,1.05vw,19px)!important;margin:.65vw 0 .9vw!important}
.sharp-html-banner-button{display:inline-block!important;padding:clamp(10px,1vw,18px) clamp(25px,3.2vw,58px)!important;border:2px solid #8d1f24!important;border-radius:8px!important;background:linear-gradient(#7d161b,#4d090c)!important;box-shadow:0 0 0 2px rgba(70,0,0,.8),0 6px 18px rgba(0,0,0,.75),inset 0 1px rgba(255,255,255,.16)!important;font-size:clamp(15px,1.65vw,29px)!important;font-weight:700!important;letter-spacing:.02em!important}
@media(max-width:700px){.sharp-html-banner-copy{inset:5% 8% 6%!important}.sharp-html-banner-title{font-size:clamp(24px,8vw,42px)!important;margin-bottom:2.5vw!important}.sharp-html-banner-text{font-size:clamp(11px,3.25vw,16px)!important}.sharp-html-banner-note{font-size:clamp(10px,3vw,14px)!important;margin:1.8vw 0 2.2vw!important}.sharp-html-banner-button{font-size:clamp(14px,4vw,19px)!important;padding:10px 24px!important}.sharp-html-banner-mask{background:radial-gradient(ellipse at 50% 50%,rgba(3,3,5,.98) 0%,rgba(3,3,5,.95) 34%,rgba(3,3,5,.68) 54%,rgba(3,3,5,.18) 72%,rgba(3,3,5,0) 88%)!important}}
'''
          if css.strip() not in s:
              s = s.replace(marker, css + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          rm .github/workflows/sharp-html-banner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/sharp-html-banner.yml
          git commit -m 'Render Vampires banner text as sharp HTML overlay'
          git push
