name: Sharp HTML Vampires banner

on:
  push:
    paths:
      - '.github/workflows/sharp-html-banner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch banner
        shell: bash
        run: |
          python -c "import base64; from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old1=base64.b64decode('').decode(); old2=base64.b64decode('').decode(); new=base64.b64decode('').decode(); css=base64.b64decode('').decode(); target=old1 if old1 in s else old2; assert target in s, 'banner not found'; s=s.replace(target,new); marker='</style>'; s=s.replace(marker,css+'\n'+marker,1) if '.sharp-html-banner{' not in s else s; p.write_text(s,encoding='utf-8')"
      - name: Commit changes
        shell: bash
        run: |
          rm .github/workflows/sharp-html-banner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/sharp-html-banner.yml
          git commit -m 'Render Vampires banner text as sharp HTML overlay'
          git push
